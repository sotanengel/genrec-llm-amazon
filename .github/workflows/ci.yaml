name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364ed1af67 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0a5ea61547d693eeaa2cff7295517a2c034be145 # v5.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests

      - name: Mypy
        run: mypy --strict src

      - name: Pytest
        run: pytest -x -n auto --timeout=10 tests/ -m "not slow"

  zizmor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364ed1af67 # v4.2.2

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@main
        with:
          workflow: .github/workflows/ci.yaml

  pinact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364ed1af67 # v4.2.2

      - name: Run pinact
        uses: sutao/pinact-action@v1
        with:
          path: .github/workflows
