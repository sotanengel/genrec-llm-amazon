[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "genrec-lite"
version = "0.1.0"
description = "GenRec-lite: LLM prefill-only encoder for recommendation (minimal reproduction)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "pyarrow>=15.0",
    "numpy>=1.26",
    "typer>=0.12",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "datasets>=2.19",
    "torch>=2.2",
    "pandas>=2.0",
]

[project.optional-dependencies]
embed = [
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "pytest-timeout>=2.3",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML>=6.0",
]

[project.scripts]
genrec-lite = "genrec_lite.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/genrec_lite"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["datasets.*", "numpy.*", "torch.*", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
addopts = "-ra"
