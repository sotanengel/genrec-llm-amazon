repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.0
          - types-PyYAML>=6.0
        args: [--strict, src]

  - repo: local
    hooks:
      - id: pytest-fast
        name: pytest-fast
        entry: pytest -x --timeout=10 tests/ -m "not slow"
        language: system
        pass_filenames: false
        always_run: true
