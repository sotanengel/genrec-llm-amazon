repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        # Default 500KB is smaller than uv.lock's realistic size for this
        # dependency tree (~550KB and growing); 2MB still catches accidental
        # commits of model checkpoints / data dumps, which is the actual risk
        # in an ML repo.
        args: [--maxkb=2048]

  - repo: local
    hooks:
      # scripts/dev.py holds the single definition of each command; the
      # Makefile delegates to the same tasks (issue #13, P2/P6). These hooks
      # call it directly rather than via `make`, because `make` does not exist
      # on Windows, where this repo is authored — going through make made every
      # local commit fail with "Executable `make` not found".
      #
      # `uv run --frozen` fails fast on a stale/missing lock instead of
      # silently re-resolving the whole (torch-sized) dependency tree.
      - id: mypy
        name: mypy
        entry: uv run --frozen python scripts/dev.py typecheck
        language: system
        pass_filenames: false
        always_run: true
      - id: pytest-fast
        name: pytest-fast
        entry: uv run --frozen python scripts/dev.py test-precommit
        language: system
        pass_filenames: false
        always_run: true
      - id: check-model-configs
        name: check-model-configs
        entry: uv run --frozen python scripts/dev.py check-model-configs
        language: system
        pass_filenames: false
        files: ^configs/model/llm/.*\.ya?ml$
